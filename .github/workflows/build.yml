name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Vendor/SpeechSwift/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Resources/Info.plist

      - name: Build app
        run: ./build.sh || { tail -100 build/xcodebuild.log; exit 1; }

      - name: Package DMG
        run: |
          STAGE=$(mktemp -d)
          cp -R "build/鲲鹏有声.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "鲲鹏有声" -srcfolder "$STAGE" -fs HFS+ -format UDZO -ov build/KunpengVoice-macOS.dmg
          shasum -a 256 build/KunpengVoice-macOS.dmg | tee build/KunpengVoice-macOS.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: KunpengVoice-macOS
          path: |
            build/KunpengVoice-macOS.dmg
            build/KunpengVoice-macOS.dmg.sha256
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/KunpengVoice-macOS.dmg
            build/KunpengVoice-macOS.dmg.sha256
          generate_release_notes: true
          body: |
            ## 安装
            1. 打开 DMG，把「鲲鹏有声」拖进「应用程序」
            2. 首次打开前在终端执行：`xattr -dr com.apple.quarantine /Applications/鲲鹏有声.app`

            要求 macOS 15+ 与 Apple Silicon。
